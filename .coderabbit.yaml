# CodeRabbit — configuração de review (buildx)
# Schema: https://docs.coderabbit.ai/reference/configuration
#
# Desde 2026-09-20 a review da nuvem NÃO roda sozinha: só por disparo manual
# (`@coderabbitai review`). O motivo está no comentário de `auto_review` abaixo.
language: 'pt-BR'
early_access: false

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false

  # REVISÃO AUTOMÁTICA DESLIGADA em 2026-09-20. Decisão do Flávio.
  # Motivo medido no painel (app.coderabbit.ai/dashboard/review-capacity), últimos
  # 7 dias: 400 eventos de revisão, 318 BLOQUEADOS por limite, 0 continuados e
  # 67 entregues. A cota é de 1 revisão por hora para a organização AxisGov INTEIRA
  # (14 repositórios na mesma fila). Revisão bloqueada é PERDIDA, não enfileirada.
  # Além disso, com auto_incremental_review: false, a revisão automática caía na
  # abertura do PR, quando ele está mais vazio.
  # A partir de agora a revisão é pedida À MÃO: comente `@coderabbitai review`
  # (só o que mudou) ou `@coderabbitai full review` (tudo), e só quando o PR vale
  # a cota (critérios no PR que fez esta mudança). Com isto desligado, o check
  # verde do CodeRabbit significa "NADA FOI PEDIDO", não "foi lido e nada achou".
  # NÃO religue sem uma medida nova de capacidade que mostre folga.
  #
  # As chaves abaixo de `enabled` só valem com a revisão automática ligada. Elas
  # ficam aqui como registro de como funcionava antes:
  # Revisão automática só na ABERTURA do PR (ou quando um rascunho vira "pronto
  # para revisão"); os commits seguintes não disparavam nova revisão.
  # PR de documentação não era revisado sozinho quando o título tinha `docs:` ou
  # `docs(`. Atenção: o CodeRabbit procura o trecho em QUALQUER parte do título,
  # não só no começo (não existe filtro por prefixo).
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    ignore_title_keywords:
      - 'docs:'
      - 'docs('

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  path_filters:
    - '!**/package-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'
    - '!**/node_modules/**'
    - '!**/dist/**'
