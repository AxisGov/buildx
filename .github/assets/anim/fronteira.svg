<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="428" viewBox="0 0 1000 428" role="img" aria-label="A fronteira: o buildx decide como o sistema se protege, nunca o que o sistema faz.">
<title>A fronteira que o buildx não atravessa: requisito não-funcional tem padrão; regra de negócio não tem</title>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.on{opacity:0}
@keyframes a1{0%,8%{opacity:0}11%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes a2{0%,14%{opacity:0}17%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes a3{0%,20%{opacity:0}23%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes a4{0%,26%{opacity:0}29%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b1{0%,34%{opacity:0}37%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b2{0%,40%{opacity:0}43%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b3{0%,46%{opacity:0}49%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b4{0%,52%{opacity:0}55%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes ww{0%,64%{opacity:0}68%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes nota{0%,76%{opacity:0}80%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes ln{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<defs>
<clipPath id="fr-clip"><rect x="1" y="1" width="998" height="426" rx="15"/></clipPath>
<pattern id="fr-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<linearGradient id="fr-line" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4493f8" stop-opacity="0"/><stop offset="0.5" stop-color="#4493f8" stop-opacity="1"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="427" rx="16" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#fr-clip)"><rect width="1000" height="428" fill="url(#fr-grid)"/></g>

<text class="sans" x="500" y="42" text-anchor="middle" font-size="15.5" fill="#e6edf3">O buildx decide <tspan fill="#4493f8" font-weight="600">como o sistema se protege</tspan>, não <tspan fill="#d29922" font-weight="600">o que o sistema faz</tspan></text>

<rect x="498" y="64" width="4" height="252" rx="2" fill="url(#fr-line)" style="animation:ln 3.2s ease-in-out infinite"/>

<!-- decide -->
<text class="mono" x="40" y="92" font-size="12" font-weight="700" fill="#4493f8">ele decide</text>
<text class="sans" x="40" y="112" font-size="12" fill="#6e7681">requisito não-funcional tem padrão defensável por classe de sistema</text>
<g class="mono" font-size="12.5">
<g class="on" style="animation:a1 13s linear infinite"><rect x="40" y="130" width="430" height="34" rx="8" fill="#12243d" stroke="#4493f8"/><text x="58" y="152" fill="#c9d1d9">rate limit nas rotas de autenticação</text><text class="sans" x="452" y="152" text-anchor="end" font-size="11" fill="#4493f8">premissa</text></g>
<g class="on" style="animation:a2 13s linear infinite"><rect x="40" y="172" width="430" height="34" rx="8" fill="#12243d" stroke="#4493f8"/><text x="58" y="194" fill="#c9d1d9">hash forte com sal, sem expiração teatral</text><text class="sans" x="452" y="194" text-anchor="end" font-size="11" fill="#4493f8">premissa</text></g>
<g class="on" style="animation:a3 13s linear infinite"><rect x="40" y="214" width="430" height="34" rx="8" fill="#12243d" stroke="#4493f8"/><text x="58" y="236" fill="#c9d1d9">backup com restauração testada</text><text class="sans" x="452" y="236" text-anchor="end" font-size="11" fill="#4493f8">premissa</text></g>
<g class="on" style="animation:a4 13s linear infinite"><rect x="40" y="256" width="430" height="34" rx="8" fill="#12243d" stroke="#4493f8"/><text x="58" y="278" fill="#c9d1d9">log sem dado pessoal, erro sem rastro</text><text class="sans" x="452" y="278" text-anchor="end" font-size="11" fill="#4493f8">premissa</text></g>
</g>
<text class="sans" x="40" y="310" font-size="11.5" fill="#6e7681">um sistema sem rate limit tem um defeito <tspan fill="#8b949e">conhecido</tspan></text>

<!-- nao chuta -->
<text class="mono" x="530" y="92" font-size="12" font-weight="700" fill="#d29922">ele nunca chuta</text>
<text class="sans" x="530" y="112" font-size="12" fill="#6e7681">regra de negócio não tem padrão — ela é o negócio</text>
<g class="mono" font-size="12.5">
<g class="on" style="animation:b1 13s linear infinite"><rect x="530" y="130" width="430" height="34" rx="8" fill="#1d1a12" stroke="#d29922" stroke-dasharray="5 3"/><text x="548" y="152" fill="#c9d1d9">como o reajuste é calculado</text><text class="sans" x="942" y="152" text-anchor="end" font-size="11" fill="#d29922">pendência</text></g>
<g class="on" style="animation:b2 13s linear infinite"><rect x="530" y="172" width="430" height="34" rx="8" fill="#1d1a12" stroke="#d29922" stroke-dasharray="5 3"/><text x="548" y="194" fill="#c9d1d9">quantos dias antes o alerta dispara</text><text class="sans" x="942" y="194" text-anchor="end" font-size="11" fill="#d29922">pendência</text></g>
<g class="on" style="animation:b3 13s linear infinite"><rect x="530" y="214" width="430" height="34" rx="8" fill="#1d1a12" stroke="#d29922" stroke-dasharray="5 3"/><text x="548" y="236" fill="#c9d1d9">quem aprova a renovação</text><text class="sans" x="942" y="236" text-anchor="end" font-size="11" fill="#d29922">pendência</text></g>
<g class="on" style="animation:b4 13s linear infinite"><rect x="530" y="256" width="430" height="34" rx="8" fill="#1d1a12" stroke="#d29922" stroke-dasharray="5 3"/><text x="548" y="278" fill="#c9d1d9">o que conta como contrato ativo</text><text class="sans" x="942" y="278" text-anchor="end" font-size="11" fill="#d29922">pendência</text></g>
</g>
<text class="sans" x="530" y="310" font-size="11.5" fill="#6e7681">segue com a decisão mais <tspan fill="#8b949e">reversível</tspan> possível, e o relatório <tspan fill="#8b949e">abre</tspan> com ela</text>

<g class="on" style="animation:ww 13s linear infinite">
<rect x="40" y="332" width="920" height="42" rx="8" fill="#1d1a12" stroke="#d29922"/>
<text class="sans" x="500" y="358" text-anchor="middle" font-size="13.5" fill="#e6edf3">Um sistema com a regra de cálculo errada <tspan fill="#d29922" font-weight="700">funciona e está errado</tspan> — o pior resultado possível, porque parece pronto.</text>
</g>
<g class="on" style="animation:nota 13s linear infinite">
<text class="sans" x="500" y="402" text-anchor="middle" font-size="12.5" fill="#8b949e">Regra de negócio que você não declarou nunca é chutada.</text>
</g>
</svg>
