<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="O buildx entrega PRs abertos, verdes e descritos, e não faz merge: integrar é decisão humana.">
<title>O merge é seu: o buildx abre os PRs verdes e para ali</title>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.on{opacity:0}
@keyframes p1{0%,6%{opacity:0}9%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes p2{0%,12%{opacity:0}15%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes p3{0%,18%{opacity:0}21%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes p4{0%,24%{opacity:0}27%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes p5{0%,30%{opacity:0}33%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes r1{0%,42%{opacity:0}45%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes r2{0%,48%{opacity:0}51%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes r3{0%,54%{opacity:0}57%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes btn{0%,64%{opacity:0}68%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes nota{0%,76%{opacity:0}80%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes hand{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
<defs>
<clipPath id="mg-clip"><rect x="1" y="1" width="998" height="398" rx="15"/></clipPath>
<pattern id="mg-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<g id="mg-ok"><circle r="7" fill="none" stroke="#3fb950" stroke-width="1.5"/><path d="M-3 0.2 l2.2 2.2 L3.2 -2" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="mg-pr"><path d="M2 3 v10 M2 3 a2 2 0 1 0 0.01 0 M2 16 a2 2 0 1 0 0.01 0 M12 8 v5 M12 16 a2 2 0 1 0 0.01 0 M12 8 a2 2 0 1 0 0.01 0 M12 10 H6 a4 4 0 0 1-4-4" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/></g>
</defs>
<rect x="0.5" y="0.5" width="999" height="399" rx="16" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#mg-clip)"><rect width="1000" height="400" fill="url(#mg-grid)"/></g>

<text class="sans" x="40" y="40" font-size="15" fill="#e6edf3">PRs abertos, verdes e descritos — e o buildx <tspan fill="#4493f8" font-weight="600">para ali</tspan></text>

<rect x="40" y="62" width="576" height="256" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="60" y="88" font-size="12" fill="#8b949e">Pull requests</text>
<text class="sans" x="596" y="88" text-anchor="end" font-size="11" fill="#6e7681">um por feature do mapa</text>
<line x1="41" y1="98" x2="615" y2="98" stroke="#21262d"/>
<g class="sans" font-size="12.5">
<g class="on" style="animation:p1 13s linear infinite"><use href="#mg-pr" x="58" y="112"/><text x="84" y="128" fill="#c9d1d9">upload e leitura de PDF</text><use href="#mg-ok" x="510" y="124"/><text class="mono" x="596" y="128" text-anchor="end" font-size="11" fill="#3fb950">aberto</text></g>
<g class="on" style="animation:p2 13s linear infinite"><use href="#mg-pr" x="58" y="150"/><text x="84" y="166" fill="#c9d1d9">alerta de vencimento</text><use href="#mg-ok" x="510" y="162"/><text class="mono" x="596" y="166" text-anchor="end" font-size="11" fill="#3fb950">aberto</text></g>
<g class="on" style="animation:p3 13s linear infinite"><use href="#mg-pr" x="58" y="188"/><text x="84" y="204" fill="#c9d1d9">relatório mensal por cliente</text><use href="#mg-ok" x="510" y="200"/><text class="mono" x="596" y="204" text-anchor="end" font-size="11" fill="#3fb950">aberto</text></g>
<g class="on" style="animation:p4 13s linear infinite"><use href="#mg-pr" x="58" y="226"/><text x="84" y="242" fill="#c9d1d9">trilha de auditoria</text><use href="#mg-ok" x="510" y="238"/><text class="mono" x="596" y="242" text-anchor="end" font-size="11" fill="#3fb950">aberto</text></g>
<g class="on" style="animation:p5 13s linear infinite"><use href="#mg-pr" x="58" y="264"/><text x="84" y="280" fill="#c9d1d9">conta e dados pessoais (LGPD)</text><use href="#mg-ok" x="510" y="276"/><text class="mono" x="596" y="280" text-anchor="end" font-size="11" fill="#3fb950">aberto</text></g>
</g>
<text class="sans" x="60" y="308" font-size="11" fill="#6e7681">cada um com o pacote de teste manual, executável por quem não programa</text>

<rect x="648" y="62" width="312" height="256" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="668" y="88" font-size="12" fill="#8b949e">reversível?</text>
<line x1="649" y1="98" x2="959" y2="98" stroke="#21262d"/>
<g class="sans" font-size="12.5">
<g class="on" style="animation:r1 13s linear infinite"><text x="668" y="126" fill="#8b949e">premissa errada</text><text class="mono" x="940" y="126" text-anchor="end" font-size="11" fill="#3fb950">se corrige</text></g>
<g class="on" style="animation:r2 13s linear infinite"><text x="668" y="154" fill="#8b949e">plano ruim</text><text class="mono" x="940" y="154" text-anchor="end" font-size="11" fill="#3fb950">se replaneja</text></g>
<g class="on" style="animation:r3 13s linear infinite"><text x="668" y="182" fill="#e6edf3">merge</text><text class="mono" x="940" y="182" text-anchor="end" font-size="11" fill="#f85149">não</text></g>
</g>
<g class="on" style="animation:btn 13s linear infinite">
<rect x="668" y="204" width="272" height="38" rx="8" fill="#21262d" stroke="#30363d" stroke-dasharray="5 3"/>
<text class="sans" x="804" y="228" text-anchor="middle" font-size="13" fill="#6e7681">Merge pull request</text>
<g style="animation:hand 2.2s ease-in-out infinite">
<text class="sans" x="804" y="272" text-anchor="middle" font-size="12.5" fill="#4493f8">↑ isto é com você</text>
</g>
<text class="sans" x="804" y="294" text-anchor="middle" font-size="11" fill="#6e7681">a última rede antes de produção</text>
</g>

<g class="on" style="animation:nota 13s linear infinite">
<line x1="40" y1="344" x2="960" y2="344" stroke="#21262d"/>
<text class="sans" x="40" y="372" font-size="13" fill="#8b949e">Um buildx que faz merge sozinho não é mais autônomo — é <tspan fill="#e6edf3">irreversível</tspan>. São coisas diferentes.</text>
</g>
</svg>
