<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-label="buildx: a camada de orquestração do método Expx. Seis etapas, da descrição ao sistema pronto.">
<title>buildx — a camada de orquestração do método Expx: uma descrição entra, um sistema sai</title>
<style>
.hb-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.hb-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hb-on{opacity:0}
@keyframes hb1{0%,6.0%{opacity:0}9.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb2{0%,14.0%{opacity:0}17.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb3{0%,22.0%{opacity:0}25.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb4{0%,30.0%{opacity:0}33.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb5{0%,38.0%{opacity:0}41.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb6{0%,62.0%{opacity:0}65.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb-loop{0%,42.0%{opacity:0}45.0%,58.0%{opacity:1}61.0%,100%{opacity:0}}
@keyframes hb-loopdash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-96}}
@keyframes hb-done{0%,70.0%{opacity:0}74.0%,93.0%{opacity:1}96.0%,100%{opacity:0}}
@keyframes hb-t1{0%,46.0%{opacity:1}49.0%,95.0%{opacity:0}98.0%,100%{opacity:1}}
@keyframes hb-t2{0%,49.0%{opacity:0}52.0%,92.0%{opacity:1}95.0%,100%{opacity:0}}
@keyframes hb-wash{0%,100%{opacity:.08}50%{opacity:.17}}
</style>
<defs>
<clipPath id="hb-clip"><rect x="1" y="1" width="998" height="354" rx="15"/></clipPath>
<pattern id="hb-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<linearGradient id="hb-wash" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="880" y2="356">
<stop offset="0" stop-color="#4493f8" stop-opacity="0"/><stop offset="0.5" stop-color="#4493f8" stop-opacity="1"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
</linearGradient>
<marker id="hb-arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4493f8"/></marker>
<g id="hb-tick"><circle r="8" fill="#4493f8" stroke="#0d1117" stroke-width="1.5"/><path d="M-3.4 0.3 L-1 2.7 L3.6 -2.3" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>

<rect x="0.5" y="0.5" width="999" height="355" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<g clip-path="url(#hb-clip)">
<rect width="1000" height="356" fill="url(#hb-grid)"/>
<rect width="1000" height="356" fill="url(#hb-wash)" style="animation:hb-wash 12s ease-in-out infinite"/>
</g>

<text class="hb-mono" x="40" y="96" font-size="56" font-weight="700" fill="#e6edf3">build<tspan fill="#4493f8">x</tspan></text>
<rect x="250" y="65" width="116" height="26" rx="13" fill="none" stroke="#4493f8" stroke-width="1"/>
<text class="hb-mono" x="308" y="82.5" text-anchor="middle" font-size="13" fill="#4493f8">método Expx</text>
<text class="hb-sans" x="40" y="130" font-size="17" fill="#8b949e">Uma descrição entra, um sistema sai</text>

<text class="hb-sans" x="960" y="83" text-anchor="end" font-size="14" fill="#8b949e" style="animation:hb-t1 12s linear infinite">A camada de <tspan fill="#4493f8" font-weight="600">orquestração</tspan> do método Expx</text>
<g style="animation:hb-t2 12s linear infinite" opacity="0">
<text class="hb-sans" x="960" y="70" text-anchor="end" font-size="14" fill="#e6edf3">Ele não implementa, não planeja, não testa.</text>
<text class="hb-sans" x="960" y="90" text-anchor="end" font-size="14" font-weight="600" fill="#4493f8">Toda a competência mora nas camadas irmãs.</text>
</g>

<!-- esteira das seis etapas -->
<path d="M111 218 H889" fill="none" stroke="#30363d" stroke-width="2"/>

<g>
<rect x="41" y="200" width="140" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="41" y="200" width="140" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb1 12s linear infinite"/>
<text class="hb-mono" x="111" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B1</tspan> concepção</text>
</g>
<g>
<rect x="193" y="200" width="134" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="193" y="200" width="134" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb2 12s linear infinite"/>
<text class="hb-mono" x="260" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B2</tspan> fundação</text>
</g>
<g>
<rect x="339" y="200" width="166" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="339" y="200" width="166" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb3 12s linear infinite"/>
<text class="hb-mono" x="422" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B3</tspan> decomposição</text>
</g>
<g>
<rect x="517" y="200" width="144" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="517" y="200" width="144" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb4 12s linear infinite"/>
<text class="hb-mono" x="589" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B4</tspan> construção</text>
</g>
<g>
<rect x="673" y="200" width="134" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="673" y="200" width="134" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb5 12s linear infinite"/>
<text class="hb-mono" x="740" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B5</tspan> recursão</text>
</g>
<g>
<rect x="819" y="200" width="140" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
<rect class="hb-on" x="819" y="200" width="140" height="36" rx="18" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:hb6 12s linear infinite"/>
<text class="hb-mono" x="889" y="223" text-anchor="middle" font-size="12.5" fill="#8b949e"><tspan font-weight="700" fill="#e6edf3">B6</tspan> validação</text>
</g>

<!-- o laço B4 <-> B5 -->
<g class="hb-on" style="animation:hb-loop 12s linear infinite">
<path d="M740 236 V266 H589 V240" fill="none" stroke="#4493f8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#hb-arrow)" style="animation:hb-loopdash 1.6s linear infinite"/>
<text class="hb-sans" x="664" y="288" text-anchor="middle" font-size="13" fill="#4493f8">pendência resolvível volta ao laço · teto de ciclos declarado</text>
</g>

<!-- resultado -->
<g class="hb-on" style="animation:hb-done 12s linear infinite">
<use href="#hb-tick" x="889" y="180"/>
<text class="hb-sans" x="960" y="288" text-anchor="end" font-size="13.5" fill="#e6edf3">features entregues · <tspan fill="#3fb950" font-weight="600">PRs abertos e verdes</tspan> · relatório final</text>
<text class="hb-sans" x="40" y="288" font-size="13.5" fill="#8b949e">o merge continua sendo seu</text>
</g>

<line x1="40" y1="308" x2="960" y2="308" stroke="#21262d"/>
<text class="hb-mono" x="40" y="331" font-size="12.5" fill="#6e7681">prodx  ·  stackx  ·  sprintx  ·  mergex</text>
<text class="hb-mono" x="960" y="331" text-anchor="end" font-size="12.5" fill="#6e7681">Claude Code  +  OpenCode</text>
</svg>
