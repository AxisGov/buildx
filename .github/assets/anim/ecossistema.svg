<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-label="O ecossistema Expx: o buildx orquestra prodx, stackx, sprintx, mergex e memox; o B3 é a única etapa que só ele faz.">
<title>O ecossistema Expx: o buildx invoca uma camada por etapa, e só o B3 é trabalho dele</title>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.on{opacity:0}
@keyframes c1{0%,5%{opacity:0}9%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes c2{0%,15%{opacity:0}19%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes c3{0%,25%{opacity:0}29%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes c4{0%,35%{opacity:0}39%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes c5{0%,45%{opacity:0}49%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes c6{0%,55%{opacity:0}59%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes hx{0%,65%{opacity:0}70%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<defs>
<clipPath id="ec-clip"><rect x="1" y="1" width="998" height="390" rx="15"/></clipPath>
<pattern id="ec-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<path id="p1" d="M470 104 C 430 128, 130 120, 110 150"/>
<path id="p2" d="M482 104 C 462 130, 286 126, 266 150"/>
<path id="p3" d="M494 104 C 490 124, 426 130, 422 150"/>
<path id="p4" d="M506 104 C 510 124, 574 130, 578 150"/>
<path id="p5" d="M518 104 C 538 130, 714 126, 734 150"/>
<path id="p6" d="M530 104 C 570 128, 870 120, 890 150"/>
</defs>

<rect x="0.5" y="0.5" width="999" height="391" rx="16" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#ec-clip)"><rect width="1000" height="392" fill="url(#ec-grid)"/></g>

<!-- o maestro -->
<rect x="392" y="52" width="216" height="52" rx="10" fill="#161b22" stroke="#4493f8" stroke-width="1.5"/>
<text class="mono" x="500" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">build<tspan fill="#4493f8">x</tspan></text>
<text class="sans" x="500" y="95" text-anchor="middle" font-size="11.5" fill="#8b949e">orquestra · não implementa</text>
<text class="sans" x="500" y="36" text-anchor="middle" font-size="13" fill="#6e7681">a única peça do método que <tspan fill="#8b949e">depende</tspan> de outras</text>

<!-- fios -->
<g fill="none" stroke="#30363d" stroke-width="1.5">
<use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/><use href="#p6"/>
</g>
<g fill="#4493f8">
<circle r="3.5"><animateMotion dur="12s" begin="0.3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="12s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="12s" begin="2.7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p3"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="12s" begin="3.9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p4"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="12s" begin="5.1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p5"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="12s" begin="6.3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.06;1" calcMode="linear"><mpath href="#p6"/></animateMotion></circle>
</g>

<!-- B1 prodx -->
<g>
<rect x="83" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="83" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c1 12s linear infinite"/>
<text class="mono" x="110" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B1</text>
<rect x="40" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect class="on" x="40" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:c1 12s linear infinite"/>
<text class="mono" x="110" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">prodx</text>
<text class="sans" x="110" y="254" text-anchor="middle" font-size="12" fill="#8b949e">escopo, lacunas</text>
<text class="sans" x="110" y="269" text-anchor="middle" font-size="12" fill="#8b949e">e veredito</text>
<text class="mono" x="110" y="292" text-anchor="middle" font-size="11" fill="#4493f8">obrigatória</text>
</g>
<!-- B2 stackx -->
<g>
<rect x="239" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="239" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c2 12s linear infinite"/>
<text class="mono" x="266" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B2</text>
<rect x="196" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect class="on" x="196" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:c2 12s linear infinite"/>
<text class="mono" x="266" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">stackx</text>
<text class="sans" x="266" y="254" text-anchor="middle" font-size="12" fill="#8b949e">convenções</text>
<text class="sans" x="266" y="269" text-anchor="middle" font-size="12" fill="#8b949e">e o template</text>
<text class="mono" x="266" y="292" text-anchor="middle" font-size="11" fill="#6e7681">opcional</text>
</g>
<!-- B3 o proprio buildx -->
<g>
<rect x="395" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="395" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c3 12s linear infinite"/>
<text class="mono" x="422" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B3</text>
<rect x="352" y="196" width="140" height="38" rx="8" fill="#12243d" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect class="on" x="352" y="196" width="140" height="38" rx="8" fill="#163356" stroke="#4493f8" stroke-width="2" style="animation:c3 12s linear infinite"/>
<text class="mono" x="422" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#4493f8">o buildx</text>
<text class="sans" x="422" y="254" text-anchor="middle" font-size="12" fill="#8b949e">quebra o projeto</text>
<text class="sans" x="422" y="269" text-anchor="middle" font-size="12" fill="#8b949e">em features</text>
<text class="mono" x="422" y="292" text-anchor="middle" font-size="11" fill="#4493f8">o vão que ele preenche</text>
</g>
<!-- B4 sprintx + mergex -->
<g>
<rect x="551" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="551" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c4 12s linear infinite"/>
<text class="mono" x="578" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B4</text>
<rect x="508" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect class="on" x="508" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:c4 12s linear infinite"/>
<text class="mono" x="578" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6edf3">sprintx + mergex</text>
<text class="sans" x="578" y="254" text-anchor="middle" font-size="12" fill="#8b949e">plano, TDD e PR</text>
<text class="sans" x="578" y="269" text-anchor="middle" font-size="12" fill="#8b949e">feature a feature</text>
<text class="mono" x="578" y="292" text-anchor="middle" font-size="11" fill="#4493f8">obrigatórias</text>
</g>
<!-- B5 memox -->
<g>
<rect x="707" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="707" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c5 12s linear infinite"/>
<text class="mono" x="734" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B5</text>
<rect x="664" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect class="on" x="664" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:c5 12s linear infinite"/>
<text class="mono" x="734" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">memox</text>
<text class="sans" x="734" y="254" text-anchor="middle" font-size="12" fill="#8b949e">não repetir</text>
<text class="sans" x="734" y="269" text-anchor="middle" font-size="12" fill="#8b949e">o que já falhou</text>
<text class="mono" x="734" y="292" text-anchor="middle" font-size="11" fill="#6e7681">opcional</text>
</g>
<!-- B6 prodx auditor -->
<g>
<rect x="863" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect class="on" x="863" y="150" width="54" height="24" rx="12" fill="#0d1117" stroke="#4493f8" style="animation:c6 12s linear infinite"/>
<text class="mono" x="890" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">B6</text>
<rect x="820" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect class="on" x="820" y="196" width="140" height="38" rx="8" fill="#21262d" stroke="#4493f8" stroke-width="1.5" style="animation:c6 12s linear infinite"/>
<text class="mono" x="890" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">prodx</text>
<text class="sans" x="890" y="254" text-anchor="middle" font-size="12" fill="#8b949e">confere o mapa</text>
<text class="sans" x="890" y="269" text-anchor="middle" font-size="12" fill="#8b949e">item a item</text>
<text class="mono" x="890" y="292" text-anchor="middle" font-size="11" fill="#4493f8">obrigatória</text>
</g>

<line x1="40" y1="314" x2="960" y2="314" stroke="#21262d"/>
<text class="sans" x="40" y="342" font-size="13" fill="#6e7681">não participam</text>
<g>
<rect x="150" y="326" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="187" y="342.5" text-anchor="middle" font-size="12" fill="#6e7681">runx</text>
<text class="sans" x="236" y="342.5" font-size="12.5" fill="#6e7681">o buildx constrói, não corrige</text>
<rect x="452" y="326" width="84" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="494" y="342.5" text-anchor="middle" font-size="12" fill="#6e7681">legadox</text>
<text class="sans" x="548" y="342.5" font-size="12.5" fill="#6e7681">projeto novo não tem legado</text>
</g>
<g class="on" style="animation:hx 12s linear infinite">
<text class="sans" x="960" y="374" text-anchor="end" font-size="12.5" fill="#8b949e">sem <tspan fill="#e6edf3">prodx</tspan>, <tspan fill="#e6edf3">sprintx</tspan> e <tspan fill="#e6edf3">mergex</tspan> ele não roda — e diz o que falta</text>
</g>
<text class="sans" x="40" y="374" font-size="12" fill="#6e7681">instalado e mantido pelo CLI expxdev</text>
</svg>
